  billing-workflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: billing_workflow_service
    command:
      [
        "node_modules/.bin/vite-node",
        "apps/billing-workflow-service/src/main.ts",
      ]
    environment:
      PORT: "3000"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/saas_contable?schema=public"
      NATS_URL: "nats://nats:4222"
      S3_ENDPOINT: "http://minio:9000"
      KEYCLOAK_URL: "http://keycloak_saas:8080"
      OIDC_ISSUER: "http://localhost:8080/realms/saas-contable"
      OIDC_AUDIENCE: "account"
      OIDC_JWKS_URI: "http://keycloak_saas:8080/realms/saas-contable/protocol/openid-connect/certs"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - saas-network

  accounting-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: accounting_client_service
    working_dir: /workspace
    command:
      [
        "sh",
        "-c",
        "npm ci && npx prisma generate --schema packages/database/prisma/schema.prisma && node_modules/.bin/vite-node apps/accounting-client-service/src/main.ts"
      ]
    environment:
      PORT: "3002"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/saas_contable?schema=public"
      OIDC_ISSUER: "http://localhost:8080/realms/saas-contable"
      OIDC_AUDIENCE: "account"
      OIDC_JWKS_URI: "http://keycloak_saas:8080/realms/saas-contable/protocol/openid-connect/certs"
    ports:
      - "3002:3002"
    volumes:
      - .:/workspace
      - accounting-client-node-modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - saas-network

  frontend:
    image: node:20-alpine
    container_name: saas_frontend
    working_dir: /workspace
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_BILLING_WORKFLOW_URL:?Definir VITE_BILLING_WORKFLOW_URL en .env}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:?Definir VITE_KEYCLOAK_URL en .env}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:?Definir VITE_KEYCLOAK_REALM en .env}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:?Definir VITE_KEYCLOAK_CLIENT_ID en .env}
      VITE_PROFILE_API_URL: ${VITE_PROFILE_API_URL:?Definir VITE_PROFILE_API_URL en .env}
    volumes:
      - .:/workspace
      - frontend-node-modules:/workspace/node_modules
    networks:
      - saas-network

  profile-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: profile_service
    working_dir: /workspace
    command:
      [
        "sh",
        "-c",
        "npm ci && npx prisma generate --schema packages/database/prisma/schema.prisma && npm run start --workspace profile-service",
      ]
    environment:
      PROFILE_PORT: ${PROFILE_PORT:?Definir PROFILE_PORT en .env}
      DATABASE_URL: ${DATABASE_URL:?Definir PROFIDATABASE_URLLE_PORT en .env}
      KEYCLOAK_URL: http://keycloak:8080
      OIDC_REALM: ${VITE_KEYCLOAK_REALM:?Definir VITE_KEYCLOAK_REALM en .env}
      OIDC_ISSUER: ${VITE_OIDC_ISSUER:?Definir VITE_OIDC_ISSUER en .env}
      OIDC_AUDIENCE: "account"
      OIDC_JWKS_URI: ${VITE_OIDC_JWKS_URI:?Definir VITE_OIDC_JWKS_URI en .env}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Definir KEYCLOAK_ADMIN_USERNAME en .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Definir KEYCLOAK_ADMIN_PASSWORD en .env}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?Definir MINIO_ENDPOINT en .env}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Definir MINIO_ACCESS_KEY en .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Definir MINIO_SECRET_KEY en .env}
      MINIO_BUCKET: ${MINIO_PROFILE_BUCKET:?Definir MINIO_PROFILE_BUCKET en .env}
    ports:
      - "3001:3001"
    volumes:
      - .:/workspace
      - profile-node-modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - saas-network

volumes:
  frontend-node-modules:
  profile-node-modules:
  accounting-client-node-modules:

networks:
  saas-network:
    driver: bridge
