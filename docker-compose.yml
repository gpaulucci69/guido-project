services:
  postgres:
    image: postgres:16-alpine
    container_name: saas_contable_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: saas_contable
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_contable"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ${DATA_ROOT:?Definir DATA_ROOT en .env}/postgres:/var/lib/postgresql/data
    networks:
      - saas-network

  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak_db
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ${DATA_ROOT:?Definir DATA_ROOT en .env}/keycloak-db:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - saas-network

  nats:
    image: nats:2.10-alpine
    container_name: saas_nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ${DATA_ROOT:?Definir DATA_ROOT en .env}/nats:/data
    networks:
      - saas-network

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: saas_minio
    restart: unless-stopped
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Definir MINIO_ACCESS_KEY en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Definir MINIO_SECRET_KEY en .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${DATA_ROOT:?Definir DATA_ROOT en .env}/minio:/data
    networks:
      - saas-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak_saas
    restart: unless-stopped
    command: start-dev --import-realm --features=scripts
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Definir KEYCLOAK_ADMIN_USERNAME en .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Definir KEYCLOAK_ADMIN_PASSWORD en .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HEALTH_ENABLED: "true"
      KC_FEATURES: "scripts"
    volumes:
      # Montaje del provider JAR compilado
      - ./cicd/keycloak/providers/role-routes-actions-mapper.jar:/opt/keycloak/providers/role-routes-actions-mapper.jar:ro
      # Montaje del archivo exportado con con setup realm/client keycloak para su importación
      - ./cicd/keycloak/import_setup/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # Montaje de temas de keycloak
      - ./cicd/keycloak/keycloak_themes:/opt/keycloak/themes:ro
    ports:
      - "8080:8080"
    networks:
      - saas-network

