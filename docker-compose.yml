services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saas_contable
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U postgres"],
        interval: 5s,
        timeout: 5s,
        retries: 10,
      }
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes: ["nats-data:/data"]
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    user: "0:0"
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadminsecret }
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      { KC_BOOTSTRAP_ADMIN_USERNAME: admin, KC_BOOTSTRAP_ADMIN_PASSWORD: admin }
    ports: ["8080:8080"]
  billing-workflow:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node_modules/.bin/vite-node", "apps/billing-workflow-service/src/main.ts"]
    environment:
      PORT: "3000"
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started
  frontend:
    image: node:20-alpine
    working_dir: /workspace
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    ports: ["5173:5173"]
    volumes:
      - .:/workspace
      - frontend-node-modules:/workspace/node_modules
volumes: { postgres-data: {}, nats-data: {}, minio-data: {}, frontend-node-modules: {} }
